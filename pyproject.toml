[project]
name = "fa-homework"
version = "0.1.0"
description = "Finite automata coursework with DeepSeek-powered notebook tutors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.4",
    "markdown>=3.8",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "nbclient>=0.10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
